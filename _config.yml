title: Comparing protein pKa predictors to assign protonation states
description: Run PROPKA3, PypKa, DelPhiPKa, pKAI and pKAI+ on the same protein structure, merge their pKa values into one table and assign protonation states at a target pH by consensus, with hen egg-white lysozyme (4LZT) as the worked example.
author: Alexandre V. Pinto
lang: en
image: /assets/img/social.jpg

# Shown at the top of the page. The topic name and colour are the ones this
